name: Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install WP-CLI
        run: |
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp

      - name: Install npm packages
        run: npm ci

      - name: Build
        run: |
          npm run build
          npm run i18n

      - name: Semantic release
        id: semantic
        uses: SwordfishLabs/codfish-semantic-release-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp release version
        if: steps.semantic.outputs.new-release-published == 'true'
        run: |
          sed -i "s/0.0.0-development/${{ steps.semantic.outputs.release-version }}/g" wp-zoom.php readme.txt

      - name: WordPress Plugin Deploy
        if: steps.semantic.outputs.new-release-published == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: wp-zoom
          VERSION: ${{ steps.semantic.outputs.release-version }}

      - name: Upload release asset
        if: |
          steps.semantic.outputs.new-release-published == 'true' &&
          startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
